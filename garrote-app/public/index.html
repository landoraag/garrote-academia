<body>
<div id="app" class="device"><div id="boot" style="position:absolute;inset:0;background:#0C0C0C;display:flex;align-items:center;justify-content:center"><img src="assets/logo.png" alt="Garrote Academia" width="170" height="34" style="height:auto;max-width:60%"></div></div>
<script>
/* abertura lenta: nada de mensagem de erro por falhas rápidas. Só se o app passar de 25 s sem abrir
   aparece um aviso simples de conexão lenta, com botão para tentar de novo */
(function(){setTimeout(function(){var a=document.getElementById('app');if(!a||a.querySelector('.screen'))return;
a.innerHTML='<div style="padding:28px;color:#fff;font:15px/1.5 sans-serif;background:#0C0C0C;min-height:100%"><b style="font-size:20px">Conexão lenta</b><p style="color:#9A9AA0">O app está demorando para abrir. Confira sua internet e tente novamente.</p><button onclick="location.reload()" style="height:48px;padding:0 24px;border:0;border-radius:14px;background:#D91E26;color:#fff;font:600 15px sans-serif">Tentar novamente</button></div>';},25000);})();
</script>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
